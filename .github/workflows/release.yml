name: Release macOS family beta

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish Apple-silicon release
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Require an Apple-silicon runner
        run: test "$(uname -m)" = "arm64"

      - name: Verify release version
        shell: bash
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          package_version="$(node -p "require('./package.json').version")"
          app_version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' macos/Info.plist)"
          test "${tag_version}" = "${package_version}"
          test "${tag_version}" = "${app_version}"

      - name: Install dependencies
        run: npm ci

      - name: Run JavaScript tests
        run: npm test

      - name: Run Swift tests
        run: swift test --package-path macos

      - name: Package the family beta
        run: npm run mac:package

      - name: Verify the app and disk image
        shell: bash
        run: |
          set -euo pipefail
          codesign --verify --deep --strict --verbose=2 build/SurStudio.app
          hdiutil verify build/SurStudio-Family-Beta-arm64.dmg
          file build/SurStudio.app/Contents/MacOS/SurStudioMac | grep -q arm64
          cd build
          shasum -a 256 --check SurStudio-Family-Beta-arm64.sha256

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: SurStudio-${{ github.ref_name }}-arm64
          if-no-files-found: error
          path: |
            build/SurStudio-Family-Beta-arm64.dmg
            build/SurStudio-Family-Beta-arm64.zip
            build/SurStudio-Family-Beta-arm64.sha256

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          build/SurStudio-Family-Beta-arm64.dmg
          build/SurStudio-Family-Beta-arm64.zip
          build/SurStudio-Family-Beta-arm64.sha256
          --verify-tag
          --generate-notes
          --title "SurStudio ${GITHUB_REF_NAME} family beta"
